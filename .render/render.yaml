databases:
  - name: mtos-db
    plan: starter
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: mtos-api
    runtime: node
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /api/healthz
    buildCommand: |
      npm install -g pnpm@10.26.1
      pnpm install --frozen-lockfile
      pnpm --filter @workspace/api-spec run codegen
      pnpm --filter @workspace/db run generate
      pnpm --filter @workspace/mtos-crm run build
      pnpm --filter @workspace/api-server run build
    startCommand: node lib/db/apply-schema.mjs && node --enable-source-maps artifacts/api-server/dist/server/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: mtos-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: ENCRYPTION_KEY_V1
        sync: false
      - key: ENCRYPTION_KEY_V2
        sync: false
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: VAPI_API_KEY
        sync: false

  - type: worker
    name: mtos-worker
    runtime: node
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: |
      npm install -g pnpm@10.26.1
      pnpm install --frozen-lockfile
      pnpm --filter @workspace/api-spec run codegen
      pnpm --filter @workspace/api-server run build:worker
    startCommand: node --enable-source-maps artifacts/api-server/dist/worker/worker.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mtos-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: ENCRYPTION_KEY_V1
        sync: false
      - key: ENCRYPTION_KEY_V2
        sync: false
