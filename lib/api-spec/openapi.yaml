openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Mass Tort Operating System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead management
  - name: documents
    description: Document management
  - name: cases
    description: Distributed case processing pipeline
  - name: worker
    description: Worker queue status
  - name: dashboard
    description: Dashboard analytics
  - name: ocr
    description: Fax OCR inbox — Legora Grid extraction
  - name: review-queue
    description: Conflict resolution review queue
  - name: npi
    description: NPI Registry doctor lookup
  - name: paralegals
    description: Paralegal management and assignment
  - name: analytics
    description: ROI tracking, conversion funnels, and performance analytics
  - name: compliance
    description: Audit trail and compliance tracking
  - name: forms
    description: Form engine — embeddable intake forms with compliance validation
  - name: vendors
    description: Vendor management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List all leads
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, qualified, signed, rejected, review_required]
        - name: tort_type
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: vendor_id
          in: query
          required: false
          schema:
            type: integer
        - name: law_firm
          in: query
          required: false
          schema:
            type: string
        - name: client_id
          in: query
          required: false
          schema:
            type: string
        - name: date_from
          in: query
          required: false
          schema:
            type: string
        - name: date_to
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a new lead (intake)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadBody"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a single lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update lead status or fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadBody"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /leads/{id}/qualify:
    post:
      operationId: qualifyLead
      tags: [leads]
      summary: Run Boolean Gatekeeper qualification on a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Qualification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationResult"

  /leads/export:
    get:
      operationId: exportLeads
      tags: [leads]
      summary: Export leads as CSV
      parameters:
        - name: lead_id
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: tort_type
          in: query
          required: false
          schema:
            type: string
        - name: vendor_id
          in: query
          required: false
          schema:
            type: integer
        - name: law_firm
          in: query
          required: false
          schema:
            type: string
        - name: client_id
          in: query
          required: false
          schema:
            type: string
        - name: date_from
          in: query
          required: false
          schema:
            type: string
        - name: date_to
          in: query
          required: false
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: fields
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List all vendors
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a new vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorBody"
      responses:
        "201":
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get a single vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vendor details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
    patch:
      operationId: updateVendor
      tags: [vendors]
      summary: Update a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVendorBody"
      responses:
        "200":
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
    delete:
      operationId: deleteVendor
      tags: [vendors]
      summary: Delete a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Vendor deleted

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List all documents
      parameters:
        - name: lead_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Upload or register a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentBody"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update document metadata or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentBody"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get pipeline summary stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/pipeline:
    get:
      operationId: getPipelineBreakdown
      tags: [dashboard]
      summary: Get lead counts grouped by status and tort type
      responses:
        "200":
          description: Pipeline breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineBreakdown"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent lead activity feed
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List all cases
      responses:
        "200":
          description: List of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
    post:
      operationId: createCase
      tags: [cases]
      summary: Submit a new case to the processing queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Case queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCaseResponse"

  /cases/worker/queue-stats:
    get:
      operationId: getQueueStats
      tags: [worker]
      summary: Get job queue statistics by status
      responses:
        "200":
          description: Queue stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStats"

  /cases/{id}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get full case detail with documents, analyses, and audit trail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{id}/upload:
    post:
      operationId: uploadCaseFile
      tags: [cases]
      summary: Upload a document to the case vault
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCaseFileBody"
      responses:
        "200":
          description: File queued for ingestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCaseResponse"

  /cases/{id}/analyze:
    post:
      operationId: analyzeCaseFiles
      tags: [cases]
      summary: Queue AI extraction and scoring for all case documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Analysis queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCaseResponse"

  /review-queue:
    get:
      operationId: listReviewQueue
      tags: [review-queue]
      summary: List review queue items with optional filters
      parameters:
        - name: resolution
          in: query
          required: false
          schema:
            type: string
        - name: conflict_type
          in: query
          required: false
          schema:
            type: string
        - name: severity
          in: query
          required: false
          schema:
            type: string
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Review queue items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewQueueItem"

  /review-queue/stats:
    get:
      operationId: getReviewQueueStats
      tags: [review-queue]
      summary: Get review queue statistics
      responses:
        "200":
          description: Review queue stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueStats"

  /review-queue/{id}:
    patch:
      operationId: resolveReviewItem
      tags: [review-queue]
      summary: Resolve a review queue item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveReviewBody"
      responses:
        "200":
          description: Resolved review item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueItem"

  /npi/search:
    get:
      operationId: searchNpi
      tags: [npi]
      summary: Search the NPI Registry for doctors and providers
      parameters:
        - name: npi_number
          in: query
          required: false
          schema:
            type: string
        - name: first_name
          in: query
          required: false
          schema:
            type: string
        - name: last_name
          in: query
          required: false
          schema:
            type: string
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: specialty
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: NPI search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NpiSearchResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /npi/lookup/{npi}:
    get:
      operationId: lookupNpi
      tags: [npi]
      summary: Look up a single provider by NPI number
      parameters:
        - name: npi
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NpiProvider"
        "404":
          description: NPI not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /forms/config:
    get:
      operationId: getFormConfigs
      tags: [forms]
      summary: Get all tort campaign form configurations
      responses:
        "200":
          description: Form configurations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormConfigList"

  /forms/config/{tortId}:
    get:
      operationId: getFormConfig
      tags: [forms]
      summary: Get a single tort form configuration
      parameters:
        - name: tortId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Form configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormConfig"
    put:
      operationId: updateFormConfig
      tags: [forms]
      summary: Update a tort form configuration (admin only)
      parameters:
        - name: tortId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormConfigUpdate"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormConfig"

  /forms/config/{tortId}/fields:
    post:
      operationId: addCustomField
      tags: [forms]
      summary: Add a custom field to a tort form (admin only)
      parameters:
        - name: tortId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomField"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormConfig"

  /forms/config/{tortId}/fields/{key}:
    delete:
      operationId: removeCustomField
      tags: [forms]
      summary: Remove a custom field from a tort form (admin only)
      parameters:
        - name: tortId
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormConfig"

  /forms/validate/email:
    post:
      operationId: validateEmail
      tags: [forms]
      summary: Validate email (RFC + typo detection)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required: [email]
      responses:
        "200":
          description: Email validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailValidationResult"

  /forms/validate/address:
    post:
      operationId: validateAddress
      tags: [forms]
      summary: Validate address (US format)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                street_address:
                  type: string
                city:
                  type: string
                state:
                  type: string
                zip:
                  type: string
              required: [street_address, city, state, zip]
      responses:
        "200":
          description: Address validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressValidationResult"

  /forms/submit:
    post:
      operationId: submitForm
      tags: [forms]
      summary: Submit intake form with full compliance validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormSubmission"
      responses:
        "201":
          description: Lead accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSubmissionResult"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormRejection"

  /forms/embed/{tortId}:
    get:
      operationId: getFormEmbed
      tags: [forms]
      summary: Get embeddable JavaScript form for a tort campaign
      parameters:
        - name: tortId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: JavaScript embed code
          content:
            application/javascript:
              schema:
                type: string

  /forms/background-check:
    post:
      operationId: runBackgroundCheck
      tags: [forms]
      summary: Run background check on a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                state:
                  type: string
                date_of_birth:
                  type: string
              required: [first_name, last_name]
      responses:
        "200":
          description: Background check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundCheckResult"

  /forms/background-check/lead/{id}:
    post:
      operationId: runLeadBackgroundCheck
      tags: [forms]
      summary: Run background check on an existing lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Background check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundCheckResult"

  /forms/categories:
    get:
      operationId: getTortCategories
      tags: [forms]
      summary: Get all tort categories with grouped torts
      responses:
        "200":
          description: Tort categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category:
                      type: string
                    torts:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          label:
                            type: string
                        required: [id, label]
                  required: [category, torts]

  /forms/npi-verify:
    post:
      operationId: verifyNpi
      tags: [forms]
      summary: Verify physician NPI and match taxonomy to diagnosis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                physician_first_name:
                  type: string
                physician_last_name:
                  type: string
                diagnosis:
                  type: string
              required: [physician_first_name, physician_last_name, diagnosis]
      responses:
        "200":
          description: NPI verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NpiVerifyResult"

  /forms/fraud-check:
    post:
      operationId: runFraudCheck
      tags: [forms]
      summary: Run fraud detection on claim data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tort_type:
                  type: string
                diagnosis:
                  type: string
                physician_first_name:
                  type: string
                physician_last_name:
                  type: string
                lead_data:
                  type: object
              required: [tort_type, diagnosis]
      responses:
        "200":
          description: Fraud check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudCheckResult"

  /forms/escalate/fbi:
    post:
      operationId: escalateToFbi
      tags: [forms]
      summary: Escalate case to FBI tip line and log event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lead_id:
                  type: string
                reason:
                  type: string
                fraud_indicators:
                  type: array
                  items:
                    type: object
              required: [lead_id, reason]
      responses:
        "200":
          description: Escalation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  fbi_tip_url:
                    type: string
                  message:
                    type: string
                required: [status, fbi_tip_url, message]

  /paralegals:
    get:
      operationId: listParalegals
      tags: [paralegals]
      summary: List all paralegals
      responses:
        "200":
          description: Paralegals list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Paralegal"
    post:
      operationId: createParalegal
      tags: [paralegals]
      summary: Create a new paralegal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateParalegalBody"
      responses:
        "201":
          description: Paralegal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paralegal"

  /paralegals/{id}:
    get:
      operationId: getParalegal
      tags: [paralegals]
      summary: Get paralegal detail with assigned leads
      parameters:
        - name: id
          in: path
