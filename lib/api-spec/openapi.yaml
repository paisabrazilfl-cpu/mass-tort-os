    NpiVerifyProviderSummary:
      type: object
      properties:
        npi:
          type: string
        name:
          type: string
        organization_name:
          type: string
        taxonomies:
          type: array
          items:
            $ref: "#/components/schemas/NpiVerifyMatchedTaxonomy"
        address:
          type: object
          properties:
            address_1:
              type: string
            city:
              type: string
            state:
              type: string
            postal_code:
              type: string
          required: [address_1, city, state, postal_code]
      required: [npi, name, organization_name, taxonomies, address]

    NpiVerifyRichResult:
      type: object
      properties:
        method:
          type: string
          nullable: true
          enum: [npi, name_search, null]
        provider:
          allOf:
            - $ref: "#/components/schemas/NpiVerifyProviderSummary"
          nullable: true
        verified:
          type: boolean
        # Three-way honest verdict layered on top of `verified`. VERIFIED when
        # all gates pass, MISMATCH when we got data back but a gate failed,
        # UNAVAILABLE when NPPES could not be reached at all (network failure,
        # HTTP error, non-JSON). UNAVAILABLE must NEVER be interpreted as
        # "doesn't match" — same honesty principle as the BG hub OFAC fix.
        # Optional in the schema so older clients don't break.
        status:
          type: string
          enum: [VERIFIED, MISMATCH, UNAVAILABLE]
        confidence:
          type: number
          format: float
        candidates_returned:
          type: integer
        checks:
          type: object
          properties:
            npi_lookup:
              type: object
              properties:
                found:
                  type: boolean
                npi:
                  type: string
                message:
                  type: string
                error:
                  type: string
              required: [found]
            search:
              type: object
              properties:
                found:
                  type: boolean
                candidates_returned:
                  type: integer
                best_score:
                  type: number
                message:
                  type: string
                error:
                  type: string
              required: [found]
            name:
              type: object
              properties:
                expected:
                  type: string
                provider:
                  type: string
                score:
                  type: number
                match:
                  type: boolean
              required: [expected, provider, score, match]
            organization:
              type: object
              properties:
                expected:
                  type: string
                provider:
                  type: string
                score:
                  type: number
                match:
                  type: boolean
              required: [expected, provider, score, match]
            location:
              type: object
              properties:
                expected_city:
                  type: string
                provider_city:
                  type: string
                city_score:
                  type: number
                city_match:
                  type: boolean
                expected_state:
                  type: string
                provider_state:
                  type: string
                state_score:
                  type: number
                state_match:
                  type: boolean
              required: [expected_city, provider_city, city_score, city_match, expected_state, provider_state, state_score, state_match]
            specialty:
              type: object
              properties:
                expected_specialty:
                  type: string
                taxonomy_matches:
                  type: array
                  items:
                    $ref: "#/components/schemas/NpiVerifyMatchedTaxonomy"
                all_taxonomies:
                  type: array
                  items:
                    type: string
                match:
                  type: boolean
              required: [expected_specialty, taxonomy_matches, all_taxonomies, match]
            decision_thresholds:
              type: object
              properties:
                identity_score:
                  type: number
                identity_ok:
                  type: boolean
                city_score:
                  type: number
                city_ok:
                  type: boolean
                state_score:
                  type: number
                state_ok:
                  type: boolean
                specialty_ok:
                  type: boolean
              required: [identity_score, identity_ok, city_score, city_ok, state_score, state_ok, specialty_ok]
      required: [method, provider, verified, confidence, checks]

