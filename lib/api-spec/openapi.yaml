openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Mass Tort Operating System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead management
  - name: documents
    description: Document management
  - name: cases
    description: Distributed case processing pipeline
  - name: worker
    description: Worker queue status
  - name: dashboard
    description: Dashboard analytics
  - name: ocr
    description: Fax OCR inbox — Legora Grid extraction
  - name: review-queue
    description: Conflict resolution review queue
  - name: npi
    description: NPI Registry doctor lookup
  - name: paralegals
    description: Paralegal management and assignment
  - name: analytics
    description: ROI tracking, conversion funnels, and performance analytics
  - name: compliance
    description: Audit trail and compliance tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List all leads
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, qualified, signed, rejected]
        - name: tort_type
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a new lead (intake)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadBody"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a single lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update lead status or fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadBody"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /leads/{id}/qualify:
    post:
      operationId: qualifyLead
      tags: [leads]
      summary: Run Boolean Gatekeeper qualification on a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Qualification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationResult"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List all documents
      parameters:
        - name: lead_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Upload or register a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentBody"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update document metadata or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentBody"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get pipeline summary stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/pipeline:
    get:
      operationId: getPipelineBreakdown
      tags: [dashboard]
      summary: Get lead counts grouped by status and tort type
      responses:
        "200":
          description: Pipeline breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineBreakdown"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent lead activity feed
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List all cases
      responses:
        "200":
          description: List of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
    post:
      operationId: createCase
      tags: [cases]
      summary: Submit a new case to the processing queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Case queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCaseResponse"

  /cases/worker/queue-stats:
    get:
      operationId: getQueueStats
      tags: [worker]
      summary: Get job queue statistics by status
      responses:
        "200":
          description: Queue stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStats"

  /cases/{id}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get full case detail with documents, analyses, and audit trail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{id}/upload:
    post:
      operationId: uploadCaseFile
      tags: [cases]
      summary: Upload a document to the case vault
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCaseFileBody"
      responses:
        "200":
          description: File queued for ingestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCaseResponse"

  /cases/{id}/analyze:
    post:
      operationId: analyzeCaseFiles
      tags: [cases]
      summary: Queue AI extraction and scoring for all case documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Analysis queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCaseResponse"

  /review-queue:
    get:
      operationId: listReviewQueue
      tags: [review-queue]
      summary: List review queue items with optional filters
      parameters:
        - name: resolution
          in: query
          required: false
          schema:
            type: string
        - name: conflict_type
          in: query
          required: false
          schema:
            type: string
        - name: severity
          in: query
          required: false
          schema:
            type: string
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Review queue items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewQueueItem"

  /review-queue/stats:
    get:
      operationId: getReviewQueueStats
      tags: [review-queue]
      summary: Get review queue statistics
      responses:
        "200":
          description: Review queue stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueStats"

  /review-queue/{id}:
    patch:
      operationId: resolveReviewItem
      tags: [review-queue]
      summary: Resolve a review queue item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveReviewBody"
      responses:
        "200":
          description: Resolved review item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueItem"

  /npi/search:
    get:
      operationId: searchNpi
      tags: [npi]
      summary: Search the NPI Registry for doctors and providers
      parameters:
        - name: npi_number
          in: query
          required: false
          schema:
            type: string
        - name: first_name
          in: query
          required: false
          schema:
            type: string
        - name: last_name
          in: query
          required: false
          schema:
            type: string
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: specialty
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: NPI search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NpiSearchResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /npi/lookup/{npi}:
    get:
      operationId: lookupNpi
      tags: [npi]
      summary: Look up a single provider by NPI number
      parameters:
        - name: npi
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NpiProvider"
        "404":
          description: NPI not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /paralegals:
    get:
      operationId: listParalegals
      tags: [paralegals]
      summary: List all paralegals
      responses:
        "200":
          description: Paralegals list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Paralegal"
    post:
      operationId: createParalegal
      tags: [paralegals]
      summary: Create a new paralegal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateParalegalBody"
      responses:
        "201":
          description: Paralegal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paralegal"

  /paralegals/{id}:
    get:
      operationId: getParalegal
      tags: [paralegals]
      summary: Get paralegal detail with assigned leads
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Paralegal detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParalegalDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /paralegals/{id}/performance:
    get:
      operationId: getParalegalPerformance
      tags: [paralegals]
      summary: Get paralegal performance breakdown
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Performance stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParalegalPerformance"

  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Full analytics overview across all modules
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /analytics/pipeline-trend:
    get:
      operationId: getPipelineTrend
      tags: [analytics]
      summary: Daily pipeline trend data
      responses:
        "200":
          description: Pipeline trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineTrendPoint"

  /analytics/conversion-funnel:
    get:
      operationId: getConversionFunnel
      tags: [analytics]
      summary: Conversion funnel stages
      responses:
        "200":
          description: Funnel stages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FunnelStage"

  /analytics/tort-breakdown:
    get:
      operationId: getTortBreakdown
      tags: [analytics]
      summary: Breakdown by tort type
      responses:
        "200":
          description: Tort breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TortBreakdownRow"

  /analytics/paralegal-leaderboard:
    get:
      operationId: getParalegalLeaderboard
      tags: [analytics]
      summary: Paralegal performance leaderboard
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParalegalLeaderboardRow"

  /compliance/audit-trail:
    get:
      operationId: getAuditTrail
      tags: [compliance]
      summary: Full audit trail with optional filters
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Audit trail
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"

  /compliance/audit-summary:
    get:
      operationId: getAuditSummary
      tags: [compliance]
      summary: Audit trail summary with counts
      responses:
        "200":
          description: Audit summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSummary"

  /ocr/upload:
    post:
      operationId: uploadFax
      tags: [ocr]
      summary: Upload a fax image for OCR processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadFaxBody"
      responses:
        "200":
          description: Fax queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadFaxResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ocr/results:
    get:
      operationId: listFaxResults
      tags: [ocr]
      summary: List all Legora Grid results
      responses:
        "200":
          description: Legora Grid results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FaxResult"

  /ocr/results/{id}:
    get:
      operationId: getFaxResult
      tags: [ocr]
      summary: Get a single Legora Grid result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Legora Grid result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaxResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ocr/queue-stats:
    get:
      operationId: getOcrQueueStats
      tags: [ocr]
      summary: OCR fax processing queue stats
      responses:
        "200":
          description: OCR queue stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Lead:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        tort_type:
          type: string
        exposure_start:
          type: string
          nullable: true
        exposure_end:
          type: string
          nullable: true
        diagnosis_confirmed:
          type: boolean
        diagnosis_type:
          type: string
          nullable: true
        was_at_location:
          type: boolean
        location_name:
          type: string
          nullable: true
        status:
          type: string
          enum: [new, qualified, signed, rejected]
        rejection_reason:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        ad_spend:
          type: number
          nullable: true
        source:
          type: string
          nullable: true
        assigned_to:
          type: integer
          nullable: true
        routing:
          type: string
          nullable: true
          enum: [hot, warm, cold]
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - name
        - tort_type
        - diagnosis_confirmed
        - was_at_location
        - status
        - created_at
        - updated_at

    CreateLeadBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        tort_type:
          type: string
        exposure_start:
          type: string
          nullable: true
        exposure_end:
          type: string
          nullable: true
        diagnosis_confirmed:
          type: boolean
        diagnosis_type:
          type: string
          nullable: true
        was_at_location:
          type: boolean
        location_name:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        ad_spend:
          type: number
          nullable: true
        source:
          type: string
          nullable: true
      required:
        - name
        - tort_type
        - diagnosis_confirmed
        - was_at_location

    UpdateLeadBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        tort_type:
          type: string
        exposure_start:
          type: string
          nullable: true
        exposure_end:
          type: string
          nullable: true
        diagnosis_confirmed:
          type: boolean
        diagnosis_type:
          type: string
          nullable: true
        was_at_location:
          type: boolean
        location_name:
          type: string
          nullable: true
        status:
          type: string
          enum: [new, qualified, signed, rejected]
        rejection_reason:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        ad_spend:
          type: number
          nullable: true
        source:
          type: string
          nullable: true

    QualificationResult:
      type: object
      properties:
        lead_id:
          type: integer
        qualified:
          type: boolean
        status:
          type: string
          enum: [qualified, rejected]
        reason:
          type: string
        gates_passed:
          type: array
          items:
            type: string
        gates_failed:
          type: array
          items:
            type: string
      required:
        - lead_id
        - qualified
        - status
        - reason
        - gates_passed
        - gates_failed

    Document:
      type: object
      properties:
        id:
          type: integer
        lead_id:
          type: integer
        document_type:
          type: string
          enum: [retainer, medical_record, intake_form, other]
        file_name:
          type: string
        file_url:
          type: string
          nullable: true
        signed:
          type: boolean
        signed_at:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
      required:
        - id
        - lead_id
        - document_type
        - file_name
        - signed
        - created_at

    CreateDocumentBody:
      type: object
      properties:
        lead_id:
          type: integer
        document_type:
          type: string
          enum: [retainer, medical_record, intake_form, other]
        file_name:
          type: string
        file_url:
          type: string
          nullable: true
        signed:
          type: boolean
        signed_at:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - lead_id
        - document_type
        - file_name
        - signed

    UpdateDocumentBody:
      type: object
      properties:
        document_type:
          type: string
          enum: [retainer, medical_record, intake_form, other]
        file_name:
          type: string
        file_url:
          type: string
          nullable: true
        signed:
          type: boolean
        signed_at:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    DashboardStats:
      type: object
      properties:
        total_leads:
          type: integer
        qualified_leads:
          type: integer
        signed_retainers:
          type: integer
        rejected_leads:
          type: integer
        new_leads:
          type: integer
        total_ad_spend:
          type: number
        cpsr:
          type: number
          nullable: true
        qualification_rate:
          type: number
        conversion_rate:
          type: number
        leads_today:
          type: integer
        leads_this_week:
          type: integer
      required:
        - total_leads
        - qualified_leads
        - signed_retainers
        - rejected_leads
        - new_leads
        - total_ad_spend
        - qualification_rate
        - conversion_rate
        - leads_today
        - leads_this_week

    PipelineBreakdown:
      type: object
      properties:
        by_status:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
            required: [status, count]
        by_tort_type:
          type: array
          items:
            type: object
            properties:
              tort_type:
                type: string
              count:
                type: integer
              qualified:
                type: integer
              signed:
                type: integer
            required: [tort_type, count, qualified, signed]
