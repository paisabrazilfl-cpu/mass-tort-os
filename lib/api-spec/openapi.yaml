      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Resend outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResendEnvelope"
        "404":
          description: Delivery or integration not found

