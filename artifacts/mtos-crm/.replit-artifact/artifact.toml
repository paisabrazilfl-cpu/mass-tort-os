kind = "web"
previewPath = "/"
title = "Mass Tort OS"
version = "1.0.0"
id = "artifacts/mtos-crm"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24540

[services.development]
run = "pnpm --filter @workspace/mtos-crm run dev"

[services.env]
PORT = "24540"
BASE_PATH = "/"

[services.production]
serve = "static"
publicDir = "artifacts/mtos-crm/dist/public"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/mtos-crm", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
